plugins {
    id '__PLUGIN__' version '1.16-SNAPSHOT'
}

version = "${project.mod_version}+${project.mc_line}-fabric"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// D16 single-source: compile ONLY the cog-generated tree (scripts\cog-gen.ps1). No shared_* srcDirs.
sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
__MAPPINGS__    compileOnly localRuntime("net.fabricmc:fabric-loader:${project.loader_version}")
    compileOnly localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
}

processResources {
    inputs.properties(["version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper, "apiMin": project.fabric_api_min])
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper, "apiMin": project.fabric_api_min
    }
    // pack.mcmeta is emitted CONCRETE (D4 range form, major 88) by cog-gen into gen/ -- not templated here.
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = __JDK__
    it.options.compilerArgs << '-Xlint:all'   // D11: zero-warning bar on every cell.
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION___JDK__
    targetCompatibility = JavaVersion.VERSION___JDK__
}

// D23: the jar manifest carries the real version, so the published file can be checked without trusting its name.
jar {
    manifest {
        attributes([
            'Implementation-Title'  : 'golemdoctor',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Kishku7'
        ])
    }
}
